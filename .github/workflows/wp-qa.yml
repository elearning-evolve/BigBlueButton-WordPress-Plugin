# Drop this file into each repo (or let rollout-github.sh do it).
# Everything real lives in the central repo; this just calls it.

name: WP QA

on:
  pull_request:
  push:
    branches: [main, master]   # direct pushes to main still get checked, PR branches only run once
  merge_group:
  workflow_dispatch:

concurrency:
  group: wp-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qa:
    uses: elearning-evolve/ci-workflows/.github/workflows/wp-qa.yml@v1
    with:
      # Minimum PHP your plugin's header declares goes first. Override per repo if needed.
      php-versions: '["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]'
      phpcs-scope: changed      # switch to "all" once a repo is clean
      fail-on-warnings: false

  # Runs ONLY if every QA check passed. Then asks the reviewer to review.
  # If QA fails, this never runs: the author fixes first, reviewer is not bothered.
  request-review:
    needs: qa
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Request manual review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWERS: adeel-raza EVOLVE-DEV-TEAM
        run: |
          asked=""
          for r in $REVIEWERS; do
            # GitHub does not allow requesting a review from the PR author.
            if [ "$(echo "$r" | tr A-Z a-z)" = "$(echo "$AUTHOR" | tr A-Z a-z)" ]; then
              echo "$r opened this PR, skipping."
              continue
            fi
            if gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$r" >/dev/null 2>&1; then
              asked="$asked @$r"
            else
              echo "::warning::Could not request review from $r. Is $r a collaborator on $REPO?"
              asked="$asked @$r"
            fi
          done
          if [ -n "$asked" ]; then
            gh pr comment "$PR" -R "$REPO" --body "All QA checks passed. Review requested from$asked." || true
          fi
